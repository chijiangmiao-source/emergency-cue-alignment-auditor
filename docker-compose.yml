services:
  api:
    build: .
    image: insertion-aligner-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  verify:
    image: insertion-aligner-api
    build: .
    command: ["python", "-m", "scripts.verify"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    restart: "no"
